services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_frontend
    working_dir: /app
    ports:
      - "5001:5001"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    networks:
      - crm-frontend

volumes:
  frontend_node_modules:

networks:
  crm-frontend:
    name: dot-net-crm-local-network